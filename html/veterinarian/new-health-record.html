<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alagang Baras - Health Monitoring</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../assets/styles/components/sidebar.css" />
    <link
      rel="stylesheet"
      href="../../assets/styles/layouts/veterinarian/health-monitoring.css"
    />
  </head>
  <body>
    <!-- Overlay for mobile -->
    <div class="overlay" id="overlay"></div>

    <!-- Hamburger Menu Button -->
    <button class="hamburger-btn" id="hamburgerBtn">
      <i class="fas fa-bars"></i>
    </button>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
      <div class="logo">
        <h4>Alagang Baras</h4>
        <p>Livestock Management System</p>
      </div>

      <div class="user-profile">
        <div class="avatar">
          <img
            src="../../assets/images/blank-profile-picture-973460_1280.png"
            alt=""
          />
          <input type="file" id="imageInput" accept="image/*" />
          <label for="imageInput">
            <i class="fa-solid fa-plus"></i>
          </label>
        </div>
        <h6>Dr. Juan Dela Cruz</h6>
        <small>Veterinarian</small>
      </div>

      <nav class="nav-menu">
        <div class="nav-item">
          <a href="./dashboard.html" class="nav-link">
            <i class="fas fa-tachometer-alt"></i>
            Dashboard
          </a>
        </div>

        <!-- Parent Item with Submenu -->
        <div class="nav-item has-submenu">
          <a href="#" class="nav-link submenu-toggle active">
            <i class="fas fa-heartbeat"></i>
            Health Monitoring
            <i class="fas fa-chevron-down submenu-icon"></i>
          </a>
          <div class="submenu">
            <a href="#" class="submenu-link active">New Health Record</a>
            <a href="./livestock-health-monitoring.html" class="submenu-link"
              >Livestock Health Monitoring</a
            >
          </div>
        </div>

        <div class="nav-item">
          <a href="../index.html" class="nav-link">
            <i class="fas fa-sign-out-alt"></i>
            Log out
          </a>
        </div>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Main Content Area -->
      <div class="col-md-9">
        <div class="content-card">
          <h1 class="page-title">New Health Record</h1>

          <form id="healthRecordForm">
            <!-- Date Field -->
            <div class="form-row">
              <label for="checkupDate" class="form-label"
                >Date of Check-up:</label
              >
              <input
                type="date"
                class="form-control"
                id="checkupDate"
                name="checkupDate"
                required
              />
            </div>

            <div class="form-row row">
              <div class="col-md-6">
                <label for="search-owner" class="form-label">Owner:</label>
                <input type="search" class="form-control" id="search-owner" />
                <ul class="list-group position-absolute w-100 mt-1" id="owner-suggestions" style="z-index: 1000; display: none;"></ul>
              </div>
              <div class="col-md-6">
                <label for="search-livestock" class="form-label"
                  >Livestock</label
                >
                <select class="form-select" id="search-livestock" name="vaccine">
                  <option value="">Select Livestock...</option>
                </select>
              </div>
            </div>

            <!-- Diagnosis Field -->
            <div class="form-row">
              <label for="diagnosis" class="form-label">Diagnosis:</label>
              <textarea
                class="form-control"
                id="diagnosis"
                name="diagnosis"
                rows="4"
                placeholder="Enter diagnosis details..."
              ></textarea>
            </div>

            <!-- Treatment Field -->
            <div class="form-row">
              <label for="treatment" class="form-label">Treatment:</label>
              <textarea
                class="form-control"
                id="treatment"
                name="treatment"
                rows="4"
                placeholder="Enter treatment details..."
              ></textarea>
            </div>

            <!-- Vaccine Field -->
            <div class="form-row">
              <label for="vaccine" class="form-label">Vaccine Given:</label>
              <select class="form-select" id="vaccine" name="vaccine">
                <option value="">Select vaccine...</option>
                <option value="rabies">Rabies Vaccine</option>
                <option value="distemper">Distemper Vaccine</option>
                <option value="parvovirus">Parvovirus Vaccine</option>
                <option value="hepatitis">Hepatitis Vaccine</option>
                <option value="leptospirosis">Leptospirosis Vaccine</option>
                <option value="other">Other</option>
              </select>
            </div>  

            <!-- Remarks Field -->
            <!-- <div class="form-row">
              <label for="remarks" class="form-label">Remarks:</label>
              <textarea
                class="form-control"
                id="remarks"
                name="remarks"
                rows="4"
                placeholder="Additional notes or observations..."
                height="100px"
              ></textarea>
            </div> -->

            <!-- Action Buttons -->
            <div class="btn-group-custom">
              <button type="submit" class="btn btn-save">
                <i class="fas fa-save me-2"></i>Save Record
              </button>
              <button type="reset" class="btn btn-reset">
                <i class="fas fa-redo me-2"></i>Reset
              </button>
              <button type="button" class="btn btn-cancel" onclick="goBack()">
                <i class="fas fa-times me-2"></i>Cancel
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>

    <script src="../../assets/scripts/sidebar.js"></script>
    <script src="../../assets/scripts/search-owner.js"></script>
    <script src="../../assets/scripts/vet-health-monitoring.js"></script>
  </body>
</html>
